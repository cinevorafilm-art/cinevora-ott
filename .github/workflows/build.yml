name: Build CineVora APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Missing Cordova & Capacitor Files
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "ext { cdvMinSdkVersion = 22 }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload CineVora APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVora-OTT-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
